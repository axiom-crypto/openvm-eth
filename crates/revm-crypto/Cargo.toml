[package]
name = "openvm-revm-crypto"
description = "OpenVM REVM and Alloy Crypto Provider Library"
version.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# revm
revm.workspace = true
openvm-accelerators.workspace = true

# alloy
alloy-primitives = { workspace = true, features = ["map-foldhash"] }
alloy-consensus = { workspace = true, features = ["crypto-backend"] }

[target.'cfg(all(target_arch = "riscv64", any(target_os = "none", target_os = "openvm")))'.dependencies]
revm-primitives = { workspace = true, features = ["hashbrown"] }
alloy-primitives = { workspace = true, features = ["native-keccak"] }

[features]
default = []
std = ["openvm-accelerators/std"]

[package.metadata.cargo-shear]
ignored = ["revm-primitives"]
