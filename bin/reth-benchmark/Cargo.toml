[package]
name = "openvm-reth-benchmark"
edition.workspace = true
repository.workspace = true
homepage.workspace = true
exclude.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
url.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
dotenv = "0.15.0"
clap = { version = "4.5.7", features = ["derive", "env"] }
clap_builder = "4.5.34"
bincode = { workspace = true, features = ["std"] }
hex = "0.4.3"
serde.workspace = true
serde_json.workspace = true
eyre.workspace = true
tokio.workspace = true
zstd.workspace = true
toml.workspace = true

# workspace
openvm-stateless-executor.workspace = true
openvm-rpc-proxy.workspace = true

# alloy
alloy-provider.workspace = true
alloy-rpc-client.workspace = true
alloy-transport.workspace = true
alloy-transport-http = { version = "=2.0.5", default-features = false, features = [
    "reqwest-rustls-tls",
] }

# reth
reth-ethereum-primitives.workspace = true

# These all come from the workspace table so the whole graph shares ONE openvm
# and ONE stark-backend source. They used to carry their own `branch` refs; that
# is not viable, because openvm-circuit-primitives and openvm-cuda-common carry
# `links` keys and Cargo permits only one package per `links` value. A ref here
# that differs from the workspace's creates a second source and fails to resolve.
openvm-stark-sdk.workspace = true
openvm-cuda-backend = { workspace = true, optional = true }
openvm-transpiler.workspace = true
openvm.workspace = true
openvm-circuit.workspace = true
openvm-verify-stark-host.workspace = true
openvm-sdk.workspace = true
openvm-sdk-config.workspace = true

# halo2
# Must track the same halo2 ref openvm's pinned tag pulls (`branch = "main"`),
# not an independent tag. Otherwise the graph carries two halo2-axiom copies and
# the older one is built against the newer rayon the rest of the stack requires,
# which does not compile. axiom-edge resolves halo2-axiom to this same commit.
halo2-axiom = { git = "https://github.com/axiom-crypto/halo2.git", branch = "main", default-features = false, optional = true }

[package.metadata.cargo-machete]
ignored = ["halo2-axiom"]

[package.metadata.cargo-shear]
ignored = ["alloy-transport-http", "halo2-axiom"]

[features]
default = ["parallel", "jemalloc", "metrics"]
parallel = ["openvm-sdk/parallel"]
metrics = ["openvm-sdk/metrics", "openvm-circuit/metrics", "openvm-stark-sdk/metrics"]
tco = ["openvm-sdk/tco"]
rvr = ["openvm-sdk/rvr"]
evm-prove = ["openvm-sdk/evm-prove", "halo2-axiom"]
evm-verify = ["evm-prove", "openvm-sdk/evm-verify", "halo2-axiom"]
perf-metrics = ["openvm-sdk/perf-metrics"]
mimalloc = ["openvm-sdk/mimalloc"]
jemalloc = ["openvm-sdk/jemalloc"]
# x86 only:
halo2-asm = ["halo2-axiom?/asm"]
cuda = ["dep:openvm-cuda-backend", "openvm-sdk/cuda"]
halo2-gpu = ["openvm-sdk/halo2-gpu"]
unprotected = ["openvm-sdk/unprotected"]
nvtx = ["openvm-stark-sdk/nvtx"]
